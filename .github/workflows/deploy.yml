name: CI / Déploiement Cloudflare

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Vérification TypeScript et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Vérification de la syntaxe de l'interface
        run: node --check public/app.js && node --check public/sw.js
      - name: Construction du Worker (sans déployer)
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/dryrun"

  deploy:
    name: Déploiement sur Cloudflare
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Point de restauration avant les migrations : en cas de problème,
      # npx wrangler d1 time-travel restore carnet --bookmark=<signet affiché ici>
      - name: Point de restauration D1
        continue-on-error: true
        run: npx wrangler d1 time-travel info carnet
      - name: Migrations D1
        run: npx wrangler d1 migrations apply carnet --remote
      - name: Déploiement du Worker
        run: npx wrangler deploy
