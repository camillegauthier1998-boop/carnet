name: CI / Déploiement Cloudflare

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Vérification TypeScript et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Vérification de la syntaxe de l'interface
        run: node --check public/app.js && node --check public/sw.js
      - name: Construction du Worker (sans déployer)
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/dryrun"

  deploy:
    name: Déploiement sur Cloudflare
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Point de restauration avant les migrations : en cas de problème,
      # npx wrangler d1 time-travel restore carnet --bookmark=<signet affiché ici>
      - name: Point de restauration D1
        continue-on-error: true
        run: npx wrangler d1 time-travel info carnet
      - name: Migrations D1
        run: npx wrangler d1 migrations apply carnet --remote
      - name: Déploiement du Worker
        run: npx wrangler deploy
      # Première mise en ligne : crée le secret des sessions s'il n'existe pas (valeur aléatoire, jamais affichée).
      # Il n'est jamais remplacé ensuite : le changer déconnecterait tout le monde.
      - name: Secret des sessions
        run: |
          set -o pipefail
          npx wrangler secret list > secrets.json
          if grep -q '"SESSION_SECRET"' secrets.json; then
            echo "SESSION_SECRET existe déjà."
          else
            openssl rand -base64 48 | tr -d '\n=' | npx wrangler secret put SESSION_SECRET
          fi
      # Première mise en ligne des notifications : crée la clé VAPID (paire P-256, jamais affichée).
      # Elle n'est jamais remplacée ensuite : la changer désabonnerait tous les téléphones.
      - name: Clé des notifications
        run: |
          set -o pipefail
          if grep -q '"VAPID_JWK"' secrets.json; then
            echo "VAPID_JWK existe déjà."
          else
            node -e "crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign']).then(k=>crypto.subtle.exportKey('jwk',k.privateKey)).then(j=>process.stdout.write(JSON.stringify({kty:j.kty,crv:j.crv,x:j.x,y:j.y,d:j.d})))" | npx wrangler secret put VAPID_JWK
          fi
